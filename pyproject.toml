[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wip-cli"
version = "1.0.0"
description = "Your work, beautifully tracked"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wip contributors" }]
keywords = ["cli", "productivity", "time-tracking", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/wip"
Repository = "https://github.com/yourusername/wip"

[project.scripts]
wip = "wip.cli:main"

[tool.setuptools.packages.find]
include = ["wip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
